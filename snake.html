<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#050510">
  <title>Snake — Neon Arcade</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    :root { color-scheme: dark; --yellow:#ffe34d; --cyan:#36e4ff; --green:#7bff4d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; color:#fff; background:radial-gradient(ellipse at 50% 45%,#171333 0,#09091a 48%,#03030a 100%); font-family:'Press Start 2P',monospace; -webkit-tap-highlight-color:transparent; }
    .cabinet { width:min(100%,560px); text-align:center; }
    .brand { color:var(--green); font-size:clamp(20px,5.5vw,34px); letter-spacing:4px; text-shadow:0 0 10px #7bff4d,0 0 26px #2fd413; margin:0 0 10px; }
    .subtitle { color:#8e8ba8; font-size:9px; letter-spacing:2px; margin-bottom:22px; }
    .screen { padding:clamp(10px,3vw,19px); background:#080817; border:3px solid #353250; border-radius:12px; box-shadow:0 0 0 5px #111022,0 16px 50px #000,0 0 34px #382c8840; }
    .hud { display:flex; justify-content:space-between; align-items:center; gap:8px; color:#fff; font-size:clamp(8px,2vw,11px); padding:2px 3px 13px; }
    .hud span { color:var(--green); }
    canvas { display:block; width:100%; height:auto; max-height:calc(100dvh - 200px); object-fit:contain; margin:0 auto; image-rendering:pixelated; background:#050513; border:1px solid #25223c; border-radius:3px; touch-action:none; }
    @media (pointer:coarse) { canvas { max-height:calc(100dvh - 330px); } }
    .message { min-height:30px; padding-top:14px; color:var(--yellow); font-size:9px; line-height:1.8; text-shadow:0 0 10px #ffbd28; cursor:pointer; user-select:none; }
    .controls { margin-top:12px; color:#77758f; font-size:8px; line-height:2.1; }
    .controls b { color:#d3d0e6; }
    .pad { display:none; width:150px; margin:12px auto 0; grid-template:repeat(2,48px)/repeat(3,48px); gap:3px; touch-action:none; }
    .pad button { border:1px solid #494568; border-radius:7px; color:var(--green); background:#16152a; font-size:18px; font-family:inherit; touch-action:none; }
    .pad button:active { background:#393354; }
    .pad .up { grid-column:2; }.pad .left {grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
    @media (pointer:coarse) { .pad { display:grid; } .controls { display:none; } }
    .topnav { display:inline-block; margin-top:14px; padding:10px 16px; color:#77758f; font-size:9px; text-decoration:none; border:1px solid #494568; border-radius:7px; background:#16152a; }
    .topnav:hover { color:var(--yellow); border-color:var(--yellow); }
  </style>
</head>
<body>
  <main class="cabinet">
    <h1 class="brand">SNAKE</h1>
    <div class="subtitle">★&nbsp; NEON SNAKE ARCADE &nbsp;★</div>
    <section class="screen" aria-label="Permainan Snake">
      <div class="hud"><div>SKOR <span id="score">000000</span></div><div>PANJANG <span id="length">03</span></div><div>HIGH <span id="highScore">000000</span></div></div>
      <canvas id="game" width="504" height="504" aria-label="Arena Snake"></canvas>
      <div class="message" id="message">TEKAN ENTER / SENTUH UNTUK MULAI</div>
    </section>
    <div class="controls"><b>↑ ↓ ← →</b> / <b>W A S D</b> / <b>SWIPE</b> gerak &nbsp;·&nbsp; <b>ENTER</b> mulai &nbsp;·&nbsp; <b>P</b> jeda</div>
    <div class="pad" aria-label="Kontrol sentuh"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div>
    <a class="topnav" href="index.html">◄ PILIH GAME</a>
  </main>
  <script>
  (() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const lengthEl = document.getElementById('length');
    const messageEl = document.getElementById('message');
    const highScoreEl = document.getElementById('highScore');

    const W = canvas.width, H = canvas.height;
    const cell = 21, cols = W / cell, rows = H / cell;

    let snake, dir, nextDir, food, score, state, tick, last, raf, accumulator, stepInterval, highScore, particles;

    highScore = parseInt(localStorage.getItem('snake_highscore')) || 0;
    const fmt = n => String(n).padStart(6, '0');

    function updateHud(){
      scoreEl.textContent = fmt(score);
      lengthEl.textContent = String(snake.length).padStart(2, '0');
      highScoreEl.textContent = fmt(Math.max(highScore, score));
    }

    function spawnFood(){
      do {
        food = {x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows)};
      } while (snake.some(s => s.x === food.x && s.y === food.y));
      food.born = performance.now();
    }

    function startGame(){
      snake = [{x: 11, y: 12}, {x: 10, y: 12}, {x: 9, y: 12}];
      dir = 'right';
      nextDir = 'right';
      score = 0;
      stepInterval = 8;
      tick = 0;
      particles = [];
      spawnFood();
      state = 'playing';
      messageEl.textContent = '';
      updateHud();
    }

    function setDir(d){
      const map = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};
      const nd = map[d];
      const cur = map[dir];
      if (nd.x === -cur.x && nd.y === -cur.y) return;
      nextDir = d;
    }

    function spawnParticles(x, y, color){
      for (let i = 0; i < 12; i++){
        const a = Math.random() * Math.PI * 2;
        const s = 1 + Math.random() * 3;
        particles.push({x, y, dx: Math.cos(a) * s, dy: Math.sin(a) * s, life: 1, color});
      }
    }

    function step(){
      tick++;
      dir = nextDir;
      const map = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};
      const d = map[dir];
      const head = {x: snake[0].x + d.x, y: snake[0].y + d.y};

      if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || snake.some(s => s.x === head.x && s.y === head.y)){
        gameOver();
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y){
        score += 10;
        stepInterval = Math.max(4, stepInterval - 0.3);
        spawnParticles(head.x * cell + cell / 2, head.y * cell + cell / 2, '#7bff4d');
        spawnFood();
        updateHud();
      } else {
        snake.pop();
      }
    }

    function gameOver(){
      state = 'over';
      highScore = Math.max(highScore, score);
      localStorage.setItem('snake_highscore', highScore);
      messageEl.textContent = 'GAME OVER — SKOR ' + fmt(score) + ' · TEKAN ENTER / SENTUH';
      updateHud();
    }

    function draw(){
      const time = performance.now() / 1000;
      ctx.fillStyle = '#050513';
      ctx.fillRect(0, 0, W, H);

      // dinding neon
      ctx.strokeStyle = '#2f6bff';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#2f6bff';
      ctx.shadowBlur = 8;
      ctx.strokeRect(4, 4, W - 8, H - 8);
      ctx.shadowBlur = 0;

      // grid samar
      ctx.strokeStyle = '#101028';
      ctx.lineWidth = 1;
      for (let x = 1; x < cols; x++){
        ctx.beginPath(); ctx.moveTo(x * cell, 6); ctx.lineTo(x * cell, H - 6); ctx.stroke();
      }
      for (let y = 1; y < rows; y++){
        ctx.beginPath(); ctx.moveTo(6, y * cell); ctx.lineTo(W - 6, y * cell); ctx.stroke();
      }

      // makanan
      const pulse = Math.sin(time * 7) * 0.5 + 0.5;
      ctx.fillStyle = '#ff4b96';
      ctx.shadowColor = '#ff4b96';
      ctx.shadowBlur = 8 + pulse * 8;
      ctx.beginPath();
      ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell / 2 - 4 + pulse * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // partikel
      for (const p of particles){
        p.x += p.dx; p.y += p.dy; p.life -= 0.05;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;
      particles = particles.filter(p => p.life > 0);

      // ular
      snake.forEach((s, i) => {
        const t = i / snake.length;
        const r = Math.round(0x36 + (0x7b - 0x36) * t);
        const g = Math.round(0xe4 + (0xff - 0xe4) * t);
        const b = Math.round(0xff + (0x4d - 0xff) * t);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.shadowColor = '#36e4ff';
        ctx.shadowBlur = i === 0 ? 12 : 5;
        const pad = i === 0 ? 2 : 3;
        ctx.fillRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2);
        ctx.shadowBlur = 0;
      });

      // mata kepala
      const head = snake[0];
      const hd = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}}[dir];
      const hx = head.x * cell + cell / 2 + hd.x * 4;
      const hy = head.y * cell + cell / 2 + hd.y * 4;
      ctx.fillStyle = '#050513';
      const ex = hd.y !== 0 ? 3 : 0, ey = hd.x !== 0 ? 3 : 0;
      ctx.fillRect(hx - ex - 1, hy - ey - 1, 3, 3);
      ctx.fillRect(hx + ex - 1, hy + ey - 1, 3, 3);

      if (state === 'paused'){
        ctx.fillStyle = '#050513b8';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffe34d';
        ctx.font = '14px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('JEDA', W / 2, H / 2);
      }
    }

    function loop(t){
      raf = requestAnimationFrame(loop);
      const dt = Math.min((t - last) / 16.667, 3);
      last = t;
      accumulator += dt;
      while (accumulator >= 1){
        accumulator -= 1;
        if (state === 'playing' && tick % Math.round(stepInterval) === 0) step();
        else tick++;
      }
      draw();
    }

    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d',' ','enter','p'].includes(k)) e.preventDefault();
      if (k === 'arrowup' || k === 'w') setDir('up');
      if (k === 'arrowdown' || k === 's') setDir('down');
      if (k === 'arrowleft' || k === 'a') setDir('left');
      if (k === 'arrowright' || k === 'd') setDir('right');
      if (k === 'enter' || k === ' '){
        if (state !== 'playing') startGame();
      }
      if (k === 'p'){
        if (state === 'playing'){ state = 'paused'; messageEl.textContent = 'JEDA — TEKAN P UNTUK LANJUT'; }
        else if (state === 'paused'){ state = 'playing'; messageEl.textContent = ''; }
      }
    });

    // swipe di layar sentuh
    let touchStart = null;
    canvas.addEventListener('pointerdown', e => {
      touchStart = {x: e.clientX, y: e.clientY};
      if (state !== 'playing') startGame();
    });
    canvas.addEventListener('pointermove', e => {
      if (!touchStart) return;
      const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
      if (Math.abs(dx) > 24 || Math.abs(dy) > 24){
        setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
        touchStart = null;
      }
    });
    canvas.addEventListener('pointerup', () => { touchStart = null; });

    document.querySelectorAll('.pad button').forEach(btn => {
      btn.addEventListener('pointerdown', e => {
        e.preventDefault();
        setDir(btn.dataset.dir);
      });
    });
    messageEl.addEventListener('click', () => { if (state !== 'playing') startGame(); });

    snake = [{x: 11, y: 12}, {x: 10, y: 12}, {x: 9, y: 12}];
    dir = 'right'; nextDir = 'right'; food = {x: 15, y: 12, born: 0};
    score = 0; state = 'ready'; tick = 0; accumulator = 0; stepInterval = 8; particles = [];
    updateHud();
    highScoreEl.textContent = fmt(highScore);
    last = performance.now();
    raf = requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
