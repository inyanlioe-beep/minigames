<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#050510">
  <title>Breakout — Neon Arcade</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    :root { color-scheme: dark; --yellow:#ffe34d; --cyan:#36e4ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; color:#fff; background:radial-gradient(ellipse at 50% 45%,#171333 0,#09091a 48%,#03030a 100%); font-family:'Press Start 2P',monospace; -webkit-tap-highlight-color:transparent; }
    .cabinet { width:min(100%,560px); text-align:center; }
    .brand { color:var(--cyan); font-size:clamp(20px,5.5vw,34px); letter-spacing:4px; text-shadow:0 0 10px #13dfff,0 0 26px #0f7bff; margin:0 0 10px; }
    .subtitle { color:#8e8ba8; font-size:9px; letter-spacing:2px; margin-bottom:22px; }
    .screen { padding:clamp(10px,3vw,19px); background:#080817; border:3px solid #353250; border-radius:12px; box-shadow:0 0 0 5px #111022,0 16px 50px #000,0 0 34px #382c8840; }
    .hud { display:flex; justify-content:space-between; align-items:center; gap:8px; color:#fff; font-size:clamp(8px,2vw,11px); padding:2px 3px 13px; }
    .hud span { color:var(--cyan); }
    canvas { display:block; width:100%; height:auto; max-height:calc(100dvh - 200px); object-fit:contain; margin:0 auto; image-rendering:pixelated; background:#050513; border:1px solid #25223c; border-radius:3px; touch-action:none; }
    @media (pointer:coarse) { canvas { max-height:calc(100dvh - 330px); } }
    .message { min-height:30px; padding-top:14px; color:var(--yellow); font-size:9px; line-height:1.8; text-shadow:0 0 10px #ffbd28; cursor:pointer; user-select:none; }
    .controls { margin-top:12px; color:#77758f; font-size:8px; line-height:2.1; }
    .controls b { color:#d3d0e6; }
    .topnav { display:inline-block; margin-bottom:16px; padding:10px 16px; color:#77758f; font-size:9px; text-decoration:none; border:1px solid #494568; border-radius:7px; background:#16152a; }
    .topnav:hover { color:var(--yellow); border-color:var(--yellow); }
    @media (pointer:coarse) { .controls { display:none; } }
  </style>
</head>
<body>
  <main class="cabinet">
    <h1 class="brand">BREAKOUT</h1>
    <div class="subtitle">★&nbsp; NEON BRICK ARCADE &nbsp;★</div>
    <section class="screen" aria-label="Permainan Breakout">
      <div class="hud"><div>SKOR <span id="score">000000</span></div><div>NYAWA <span id="lives">♥♥♥</span></div><div>HIGH <span id="highScore">000000</span></div></div>
      <canvas id="game" width="504" height="576" aria-label="Arena Breakout"></canvas>
      <div class="message" id="message">TEKAN ENTER / SENTUH UNTUK MULAI</div>
    </section>
    <div class="controls"><b>← →</b> / <b>A D</b> / <b>MOUSE</b> gerak &nbsp;·&nbsp; <b>ENTER</b> mulai &nbsp;·&nbsp; <b>P</b> jeda</div>
    <a class="topnav" href="index.html">◄ PILIH GAME</a>
  </main>
  <script>
  (() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const messageEl = document.getElementById('message');
    const highScoreEl = document.getElementById('highScore');

    const W = canvas.width, H = canvas.height;
    const paddleW = 88, paddleH = 12;
    const ballR = 6.5;
    const ROWS = 6, COLS = 12;
    const BRICK_TOP = 64, BRICK_W = 36, BRICK_H = 18, BRICK_GAP = 4;
    const BRICK_LEFT = (W - COLS * (BRICK_W + BRICK_GAP) + BRICK_GAP) / 2;
    const ROW_COLORS = ['#ff4b96','#ff9b31','#ffe34d','#7bff4d','#36e4ff','#b787ff'];
    const ROW_POINTS = [7, 5, 4, 3, 2, 1];

    let score = 0, lives = 3, state = 'ready', tick = 0, last = 0, raf = 0, accumulator = 0;
    let highScore = parseInt(localStorage.getItem('breakout_highscore')) || 0;
    let bricks = [];
    let shakeT = 0;
    let particles = [];

    const paddle = {x: W / 2 - paddleW / 2, y: H - 48, w: paddleW, h: paddleH, move: 0};
    const ball = {x: W / 2, y: paddle.y - ballR - 1, dx: 0, dy: 0, speed: 4.6, stuck: true};

    const fmt = n => String(n).padStart(6, '0');
    function updateHud(){
      scoreEl.textContent = fmt(score);
      livesEl.textContent = '♥'.repeat(Math.max(0, lives));
      highScoreEl.textContent = fmt(Math.max(highScore, score));
    }

    function buildBricks(){
      bricks = [];
      for (let r = 0; r < ROWS; r++){
        for (let c = 0; c < COLS; c++){
          bricks.push({x: BRICK_LEFT + c * (BRICK_W + BRICK_GAP), y: BRICK_TOP + r * (BRICK_H + BRICK_GAP), row: r, alive: true});
        }
      }
    }

    function resetBall(){
      ball.stuck = true;
      ball.speed = 4.6;
      ball.dx = 0;
      ball.dy = 0;
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ballR - 1;
    }

    function startGame(){
      score = 0;
      lives = 3;
      buildBricks();
      particles = [];
      resetBall();
      state = 'playing';
      messageEl.textContent = '';
      updateHud();
    }

    function launch(){
      if (!ball.stuck) return;
      ball.stuck = false;
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
      ball.dx = Math.cos(angle) * ball.speed;
      ball.dy = Math.sin(angle) * ball.speed;
    }

    function spawnParticles(x, y, color){
      for (let i = 0; i < 10; i++){
        const a = Math.random() * Math.PI * 2;
        const s = 1 + Math.random() * 3;
        particles.push({x, y, dx: Math.cos(a) * s, dy: Math.sin(a) * s, life: 1, color});
      }
    }

    function loseLife(){
      lives--;
      shakeT = 12;
      updateHud();
      if (lives <= 0){
        state = 'over';
        highScore = Math.max(highScore, score);
        localStorage.setItem('breakout_highscore', highScore);
        messageEl.textContent = 'GAME OVER — SKOR ' + fmt(score) + ' · TEKAN ENTER / SENTUH';
      } else {
        state = 'ready';
        resetBall();
        messageEl.textContent = 'BOLA HILANG — TEKAN ENTER / SENTUH';
      }
    }

    function step(){
      tick++;
      if (shakeT > 0) shakeT--;

      if (state === 'playing' || state === 'ready'){
        paddle.x += paddle.move * 6.4;
        paddle.x = Math.max(6, Math.min(W - paddle.w - 6, paddle.x));
        if (ball.stuck){
          ball.x = paddle.x + paddle.w / 2;
          ball.y = paddle.y - ballR - 1;
        } else {
          ball.x += ball.dx;
          ball.y += ball.dy;
          if (ball.x < ballR){ ball.x = ballR; ball.dx = Math.abs(ball.dx); }
          if (ball.x > W - ballR){ ball.x = W - ballR; ball.dx = -Math.abs(ball.dx); }
          if (ball.y < ballR){ ball.y = ballR; ball.dy = Math.abs(ball.dy); }
          if (ball.y > H + ballR * 2) loseLife();

          // pantulan paddle
          if (ball.dy > 0 && ball.y + ballR >= paddle.y && ball.y + ballR <= paddle.y + paddle.h + 8 && ball.x >= paddle.x - ballR && ball.x <= paddle.x + paddle.w + ballR){
            ball.y = paddle.y - ballR;
            const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
            const ang = -Math.PI / 2 + hit * 1.05;
            ball.speed = Math.min(7.5, ball.speed + 0.08);
            ball.dx = Math.cos(ang) * ball.speed;
            ball.dy = Math.sin(ang) * ball.speed;
          }

          // tabrakan balok
          for (const b of bricks){
            if (!b.alive) continue;
            if (ball.x + ballR > b.x && ball.x - ballR < b.x + BRICK_W && ball.y + ballR > b.y && ball.y - ballR < b.y + BRICK_H){
              b.alive = false;
              score += ROW_POINTS[b.row] * 10;
              updateHud();
              spawnParticles(b.x + BRICK_W / 2, b.y + BRICK_H / 2, ROW_COLORS[b.row]);
              const overX = Math.min(Math.abs(ball.x - b.x), Math.abs(ball.x - (b.x + BRICK_W)));
              const overY = Math.min(Math.abs(ball.y - b.y), Math.abs(ball.y - (b.y + BRICK_H)));
              if (overX < overY) ball.dx = -ball.dx; else ball.dy = -ball.dy;
              if (bricks.every(x => !x.alive)){
                state = 'win';
                highScore = Math.max(highScore, score);
                localStorage.setItem('breakout_highscore', highScore);
                messageEl.textContent = 'MENANG! SKOR ' + fmt(score) + ' · TEKAN ENTER / SENTUH';
              }
              break;
            }
          }
        }
      }

      for (const p of particles){
        p.x += p.dx;
        p.y += p.dy;
        p.life -= 0.04;
      }
      particles = particles.filter(p => p.life > 0);
    }

    function draw(){
      const time = performance.now() / 1000;
      ctx.save();
      if (shakeT > 0) ctx.translate((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4);

      ctx.fillStyle = '#050513';
      ctx.fillRect(-6, -6, W + 12, H + 12);

      // dinding neon
      ctx.strokeStyle = '#2f3fff';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#2f3fff';
      ctx.shadowBlur = 8;
      ctx.strokeRect(4, 4, W - 8, H - 8);

      // balok
      for (const b of bricks){
        if (!b.alive) continue;
        const pulse = Math.sin(time * 3 + b.row) * 0.5 + 0.5;
        ctx.fillStyle = ROW_COLORS[b.row];
        ctx.globalAlpha = 0.92;
        ctx.shadowColor = ROW_COLORS[b.row];
        ctx.shadowBlur = 6 + pulse * 4;
        ctx.fillRect(b.x, b.y, BRICK_W, BRICK_H);
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }

      // partikel
      for (const p of particles){
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;

      // paddle
      ctx.fillStyle = '#ffe34d';
      ctx.shadowColor = '#ffbd28';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(paddle.x + 6, paddle.y);
      ctx.lineTo(paddle.x + paddle.w - 6, paddle.y);
      ctx.quadraticCurveTo(paddle.x + paddle.w, paddle.y, paddle.x + paddle.w, paddle.y + 6);
      ctx.lineTo(paddle.x + paddle.w, paddle.y + paddle.h - 6);
      ctx.quadraticCurveTo(paddle.x + paddle.w, paddle.y + paddle.h, paddle.x + paddle.w - 6, paddle.y + paddle.h);
      ctx.lineTo(paddle.x + 6, paddle.y + paddle.h);
      ctx.quadraticCurveTo(paddle.x, paddle.y + paddle.h, paddle.x, paddle.y + paddle.h - 6);
      ctx.lineTo(paddle.x, paddle.y + 6);
      ctx.quadraticCurveTo(paddle.x, paddle.y, paddle.x + 6, paddle.y);
      ctx.fill();

      // bola
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#13dfff';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ballR, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      if (state === 'paused'){
        ctx.fillStyle = '#050513b8';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ffe34d';
        ctx.font = '14px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('JEDA', W / 2, H / 2);
      }
      ctx.restore();
    }

    function loop(t){
      raf = requestAnimationFrame(loop);
      const dt = Math.min((t - last) / 16.667, 3);
      last = t;
      accumulator += dt;
      while (accumulator >= 1){ step(); accumulator -= 1; }
      draw();
    }

    const keys = {};
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (['arrowleft','arrowright','a','d',' ','enter','p'].includes(k)) e.preventDefault();
      if (keys[k]) return;
      keys[k] = true;
      if (k === 'arrowleft' || k === 'a') paddle.move = -1;
      if (k === 'arrowright' || k === 'd') paddle.move = 1;
      if (k === 'enter' || k === ' '){
        if (state === 'ready' && lives === 3 && score === 0 && !bricks.length) startGame();
        else if (state === 'ready') { state = 'playing'; messageEl.textContent = ''; launch(); }
        else if (state === 'over' || state === 'win') startGame();
        else if (state === 'playing') launch();
      }
      if (k === 'p'){
        if (state === 'playing'){ state = 'paused'; messageEl.textContent = 'JEDA — TEKAN P UNTUK LANJUT'; }
        else if (state === 'paused'){ state = 'playing'; messageEl.textContent = ''; }
      }
    });
    window.addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      keys[k] = false;
      if ((k === 'arrowleft' || k === 'a') && !keys['arrowright'] && !keys['d']) paddle.move = 0;
      if ((k === 'arrowright' || k === 'd') && !keys['arrowleft'] && !keys['a']) paddle.move = 0;
    });

    function pointerMove(clientX){
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) / rect.width * W;
      paddle.x = Math.max(6, Math.min(W - paddle.w - 6, x - paddle.w / 2));
    }
    canvas.addEventListener('pointermove', e => pointerMove(e.clientX));
    canvas.addEventListener('pointerdown', e => {
      pointerMove(e.clientX);
      if (state === 'ready' && !bricks.length) startGame();
      else if (state === 'ready'){ state = 'playing'; messageEl.textContent = ''; launch(); }
      else if (state === 'over' || state === 'win') startGame();
      else if (state === 'playing') launch();
    });
    messageEl.addEventListener('click', () => {
      if (state === 'ready' && !bricks.length) startGame();
      else if (state === 'ready'){ state = 'playing'; messageEl.textContent = ''; launch(); }
      else if (state === 'over' || state === 'win') startGame();
    });

    buildBricks();
    updateHud();
    highScoreEl.textContent = fmt(highScore);
    raf = requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
